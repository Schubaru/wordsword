name: Wordsword
options:
  bundleIdPrefix: com.alexschumacher
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
targets:
  Wordsword:
    type: application
    platform: iOS
    sources: [Wordsword]
    # Sign in with Apple. Needs a signing team and the capability on the bundle ID to actually
    # work — until then the button returns an error and the flow says so.
    entitlements:
      path: Wordsword/Wordsword.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Wordsword/Info.plist
      properties:
        CFBundleDisplayName: wordsword
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [wordsword]
        # Hold-to-speak on the home input. Speech runs on-device when the device supports it.
        NSMicrophoneUsageDescription: wordsword listens while you hold the input, so you can say a word instead of typing it.
        NSSpeechRecognitionUsageDescription: Speech recognition turns what you say into the word you're looking up. It runs on your iPhone whenever your device supports it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # Export compliance: the app uses only HTTPS/ATS and no custom or non-exempt
        # cryptography, so it qualifies for the exemption. Declaring it here removes the
        # per-upload questionnaire in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
      configs:
        # On a real iPhone, Debug signs with the free Personal Team. A free team can't carry Sign in
        # with Apple, so the device build drops that entitlement (the button says it can't sign in),
        # and it uses a .dev bundle ID so the real one stays unclaimed for the paid team. Simulator
        # builds are untouched. Once enrollment clears: the paid team's ID, and drop these overrides.
        Debug:
          DEVELOPMENT_TEAM: DJKZQ223JK
          CODE_SIGN_STYLE: Automatic
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          "CODE_SIGNING_REQUIRED[sdk=iphoneos*]": "YES"
          "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": ""
          "PRODUCT_BUNDLE_IDENTIFIER[sdk=iphoneos*]": com.alexschumacher.Wordsword.dev
  WordswordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WordswordUITests]
    dependencies: [{ target: Wordsword }]
    settings:
      base:
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  Wordsword:
    build: { targets: { Wordsword: all, WordswordUITests: [test] } }
    run: { config: Debug }
    test:
      config: Debug
      targets: [WordswordUITests]
      environmentVariables:
        SHOTS_DIR: /private/tmp/claude-501/-Users-alexschumacher-wordsword/bf1a588a-d2ee-4503-886e-77f297c1de9a/scratchpad/shots
