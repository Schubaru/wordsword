name: Wordsword
options:
  bundleIdPrefix: com.alexschumacher
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
targets:
  Wordsword:
    type: application
    platform: iOS
    sources: [Wordsword]
    # Sign in with Apple. Automatic signing adds the capability to the bundle ID on the paid team.
    entitlements:
      path: Wordsword/Wordsword.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Wordsword/Info.plist
      properties:
        CFBundleDisplayName: wordsword
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [wordsword]
        # The mic button in Home's search field. Speech runs on-device when the device supports it.
        NSMicrophoneUsageDescription: wordsword listens after you tap the mic, until you stop talking or tap it again, so you can say a word instead of typing it.
        NSSpeechRecognitionUsageDescription: Speech recognition turns what you say into the word you're looking up. It runs on your iPhone whenever your device supports it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # Export compliance: the app uses only HTTPS/ATS and no custom or non-exempt
        # cryptography, so it qualifies for the exemption. Declaring it here removes the
        # per-upload questionnaire in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Alex's paid Apple Developer Program team (individual). Never Upstory LLC's RPH46L7S8Z.
        DEVELOPMENT_TEAM: DJKZQ223JK
        CODE_SIGN_STYLE: Automatic
  WordswordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WordswordUITests]
    dependencies: [{ target: Wordsword }]
    settings:
      base:
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  Wordsword:
    build: { targets: { Wordsword: all, WordswordUITests: [test] } }
    run: { config: Debug }
    test:
      config: Debug
      targets: [WordswordUITests]
      environmentVariables:
        SHOTS_DIR: /private/tmp/claude-501/-Users-alexschumacher-wordsword/bf1a588a-d2ee-4503-886e-77f297c1de9a/scratchpad/shots
