name: Wordsword
options:
  bundleIdPrefix: com.alexschumacher
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
targets:
  Wordsword:
    type: application
    platform: iOS
    sources: [Wordsword]
    info:
      path: Wordsword/Info.plist
      properties:
        CFBundleDisplayName: wordsword
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [wordsword]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
  WordswordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WordswordUITests]
    dependencies: [{ target: Wordsword }]
    settings:
      base:
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  Wordsword:
    build: { targets: { Wordsword: all, WordswordUITests: [test] } }
    run: { config: Debug }
    test:
      config: Debug
      targets: [WordswordUITests]
      environmentVariables:
        SHOTS_DIR: /private/tmp/claude-501/-Users-alexschumacher-wordsword/bf1a588a-d2ee-4503-886e-77f297c1de9a/scratchpad/shots
